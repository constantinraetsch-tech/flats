<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FLATS</title>
<meta name="theme-color" content="#f4f6f9">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FLATS">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Light only. Layout: sticky top bar (title, stats, filters), then photo-first cards — one column on phones, two on wide screens. */
:root{
  --bg:#f4f6f9; --surface:#ffffff; --ink:#141c26; --muted:#5f6b78; --line:#e1e6ec;
  --accent:#1d4fc4; --accent-soft:#e8eefc; --new:#c27c00; --good:#16794a; --good-soft:#e3f4ea; --warn:#b4531b; --warn-soft:#fcece2;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.gutter{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{position:sticky;top:0;z-index:5;background:rgba(244,246,249,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.bar .gutter{padding-block:14px 12px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1;margin:0;letter-spacing:-.01em}
h1 span{color:var(--accent)}
.crit{font-size:12.5px;color:var(--muted);margin-top:3px}
.refresh{font:inherit;font-size:13px;font-weight:600;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--accent);cursor:pointer;flex-shrink:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 10px}
.stat b{display:block;font-family:var(--f-mono);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.controls{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.tabs{display:flex;gap:4px;background:var(--line);padding:3px;border-radius:10px;overflow-x:auto;max-width:100%}
.tab{font:inherit;font-size:13px;font-weight:500;padding:5px 11px;border:0;background:transparent;color:var(--muted);border-radius:7px;cursor:pointer;white-space:nowrap}
.tab[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(20,28,38,.08)}
.sort{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main.gutter{padding-block:18px calc(env(safe-area-inset-bottom,0px) + 40px);display:flex;flex-direction:column;gap:18px}
.list{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:720px){.list{grid-template-columns:1fr 1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card.dim{opacity:.55}
.ph{position:relative;aspect-ratio:16/10;max-width:100%;background:linear-gradient(135deg,#e8eefc,#dfe5ee);display:block}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.ph .none{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px}
.badges{position:absolute;top:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap}
.b{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.b.new{background:var(--new);color:#fff}
.b.strong{background:var(--good);color:#fff}
.b.check{background:var(--surface);color:var(--warn)}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.pr{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pr .m{font-family:var(--f-mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.pr .pp{font-size:13px;font-weight:600;padding:1px 7px;border-radius:6px}
.pp.ok{background:var(--good-soft);color:var(--good)}
.pp.over{background:var(--warn-soft);color:var(--warn)}
.pr .u{font-size:13px;color:var(--muted)}
.area{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
.ttl{font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.25;margin:0;overflow-wrap:anywhere}
.specs{display:flex;flex-wrap:wrap;gap:6px}
.spec{font-size:12.5px;padding:2px 8px;border-radius:6px;background:var(--bg);color:var(--ink)}
.notes{font-size:13.5px;color:var(--muted);margin:0}
.src{font-size:12px;color:var(--muted)}
.actions{display:flex;gap:6px;align-items:center;margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}
.btn{font:inherit;font-size:13px;font-weight:500;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.open{margin-left:auto;font-size:13px;font-weight:600;padding:7px 12px;border-radius:8px;background:var(--accent);color:#fff;text-decoration:none;white-space:nowrap}
.empty{background:var(--surface);padding:26px 22px;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
.empty h2{font-family:var(--f-display);font-size:19px;color:var(--ink);margin:0 0 6px}
.foot{font-size:13px;color:var(--muted)}
.foot a{color:var(--accent)}
</style>
</head>
<body>
<header class="bar">
  <div class="gutter">
    <div class="row">
      <div>
        <h1>FLATS<span>.</span></h1>
        <div class="crit">3+ bed · max €3,000 · furnished · 1 Jan – 30 Jun 2027</div>
      </div>
      <button class="refresh" id="refresh">Refresh</button>
    </div>
    <div class="stats">
      <div class="stat"><b id="s-all">–</b><span>Flats</span></div>
      <div class="stat"><b id="s-new">–</b><span>New 48h</span></div>
      <div class="stat"><b id="s-saved">–</b><span>Saved</span></div>
    </div>
    <div class="controls">
      <div class="tabs" role="group" aria-label="Filter">
        <button class="tab" data-f="active" aria-pressed="true">All</button>
        <button class="tab" data-f="new" aria-pressed="false">New</button>
        <button class="tab" data-f="saved" aria-pressed="false">Saved</button>
        <button class="tab" data-f="contacted" aria-pressed="false">Contacted</button>
        <button class="tab" data-f="hidden" aria-pressed="false">Hidden</button>
      </div>
      <select class="sort" id="sort" aria-label="Sort">
        <option value="new">Newest</option>
        <option value="cheap">Cheapest</option>
        <option value="fit">Best fit</option>
      </select>
    </div>
  </div>
</header>

<main class="gutter">
  <div class="list" id="list"><div class="empty"><h2>Loading flats…</h2>One moment.</div></div>
  <p class="foot" id="foot"></p>
  <p class="foot">Areas: Vila de Gràcia, Sant Gervasi–Galvany, Dreta and Nova Esquerra de l'Eixample. Idealista isn't part of the daily check; use its app alerts. <a href="https://www.idealista.com/en/" target="_blank" rel="noopener">Open Idealista</a></p>
</main>

<script>
(function(){
  let data={listings:[]}, filter="active", sort="new", marks={};
  try{marks=JSON.parse(localStorage.getItem("flats-marks")||"{}")}catch(e){}
  try{filter=localStorage.getItem("flats-filter")||"active";sort=localStorage.getItem("flats-sort")||"new"}catch(e){}
  const $=s=>document.querySelector(s);
  const eur=n=>"€"+Math.round(n).toLocaleString("en-GB");
  const isNew=l=>l.foundAt&&(Date.now()-new Date(l.foundAt).getTime())<48*3600e3;
  const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const store=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
  $("#sort").value=sort;

  function setTabs(){document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.f===filter)))}
  document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{filter=b.dataset.f;store("flats-filter",filter);setTabs();render()}));
  $("#sort").addEventListener("change",e=>{sort=e.target.value;store("flats-sort",sort);render()});
  setTabs();

  const fitRank=l=>l.fit==="strong"?0:l.fit==="check"?1:2;
  function render(){
    const all=data.listings||[];
    const vis=all.filter(l=>marks[l.id]!=="hidden");
    $("#s-all").textContent=vis.length;
    $("#s-new").textContent=vis.filter(isNew).length;
    $("#s-saved").textContent=all.filter(l=>marks[l.id]==="saved").length;
    $("#foot").textContent=data.lastRun?"Last check: "+new Date(data.lastRun).toLocaleString("en-GB",{weekday:"long",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})+(data.sources?.length?" · "+data.sources.join(", "):""):"";
    let rows=all.filter(l=>{
      const m=marks[l.id]||"";
      if(filter==="hidden")return m==="hidden";
      if(m==="hidden")return false;
      if(filter==="new")return isNew(l);
      if(filter==="saved")return m==="saved";
      if(filter==="contacted")return m==="contacted";
      return true;
    });
    rows.sort(sort==="cheap"?(a,b)=>(a.price??1e9)-(b.price??1e9):sort==="fit"?(a,b)=>fitRank(a)-fitRank(b)||(a.price??1e9)-(b.price??1e9):(a,b)=>(b.foundAt||"").localeCompare(a.foundAt||""));
    const list=$("#list");
    if(!rows.length){
      const msg={active:["No flats yet","New matches appear here after each morning check."],new:["Nothing new in 48 hours","New flats show up here after each morning check."],saved:["No saved flats","Tap Save on a flat to keep it here."],contacted:["Nothing marked as contacted","Mark a flat once you've written to the landlord."],hidden:["Nothing hidden","Flats you hide move here."]}[filter];
      list.innerHTML=`<div class="empty"><h2>${msg[0]}</h2>${msg[1]}</div>`;return;
    }
    list.innerHTML=rows.map(l=>{
      const m=marks[l.id]||"";
      const pp=l.price?l.price/3:null;
      const specs=[l.bedrooms&&`${l.bedrooms} bed`,l.bathrooms&&`${l.bathrooms} bath`,l.size&&`${l.size} m²`,l.furnished&&"Furnished",l.lift&&"Lift",l.terms].filter(Boolean).map(s=>`<span class="spec">${esc(s)}</span>`).join("");
      const badges=(isNew(l)?'<span class="b new">New</span>':"")+(l.fit==="strong"?'<span class="b strong">Strong fit</span>':l.fit==="check"?'<span class="b check">Check details</span>':"");
      return `<article class="card ${m==="hidden"?"dim":""}">
        <a class="ph" href="${esc(l.url)}" target="_blank" rel="noopener" aria-label="Open listing">
          <span class="none">No photo · ${esc(l.source||"")}</span>
          ${l.photo?`<img src="${esc(l.photo)}" alt="${esc(l.title)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:""}
          ${badges?`<span class="badges">${badges}</span>`:""}
        </a>
        <div class="body">
          <div class="pr">${l.price?`<span class="m">${eur(l.price)}</span><span class="u">/mo</span><span class="pp ${pp<=1000?"ok":"over"}">${eur(pp)} pp</span>`:`<span class="m" style="font-size:17px">Price on request</span>`}</div>
          <div class="area">${esc(l.area||"Barcelona")}</div>
          <h3 class="ttl">${esc(l.title)}</h3>
          ${specs?`<div class="specs">${specs}</div>`:""}
          ${l.notes?`<p class="notes">${esc(l.notes)}</p>`:""}
          <div class="src">${esc(l.source||"")}${l.foundAt?" · found "+esc(new Date(l.foundAt).toLocaleDateString("en-GB",{day:"numeric",month:"short"})):""}</div>
          <div class="actions">
            <button class="btn" data-id="${esc(l.id)}" data-m="saved" aria-pressed="${m==="saved"}">${m==="saved"?"★ Saved":"☆ Save"}</button>
            <button class="btn" data-id="${esc(l.id)}" data-m="contacted" aria-pressed="${m==="contacted"}">✓ Contacted</button>
            <button class="btn" data-id="${esc(l.id)}" data-m="hidden" aria-pressed="${m==="hidden"}">${m==="hidden"?"Unhide":"Hide"}</button>
            <a class="open" href="${esc(l.url)}" target="_blank" rel="noopener">Open ↗</a>
          </div>
        </div></article>`;
    }).join("");
  }

  document.addEventListener("click",e=>{
    const b=e.target.closest(".btn[data-m]");if(!b)return;
    const id=b.dataset.id,want=b.dataset.m;
    marks[id]=marks[id]===want?"":want;store("flats-marks",JSON.stringify(marks));render();
  });

  async function load(){
    const btn=$("#refresh");btn.textContent="Loading…";
    try{
      const r=await fetch("listings.json?t="+Date.now(),{cache:"no-store"});
      if(!r.ok)throw new Error(r.status);
      data=await r.json();render();
    }catch(e){
      if(!(data.listings||[]).length)$("#list").innerHTML='<div class="empty"><h2>Couldn\'t load flats</h2>Check your connection and tap Refresh.</div>';
    }finally{btn.textContent="Refresh"}
  }
  $("#refresh").addEventListener("click",load);
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")load()});
  load();
  if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
</body>
</html>
